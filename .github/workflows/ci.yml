name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ups
          POSTGRES_PASSWORD: ups_ci_password
          POSTGRES_DB: ups_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ups -d ups_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: apps/api

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ups:ups_ci_password@localhost:5432/ups_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      ALLOWED_EMAIL_DOMAINS: ups.edu.ec,est.ups.edu.ec
      SWAGGER_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install API dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma validate

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Verify migration status
        run: pnpm prisma migrate status

      - name: Calendar PostgreSQL integration
        env:
          RUN_CALENDAR_INTEGRATION: "true"
        run: pnpm test:calendar:integration

      - name: ScheduledDeparture PostgreSQL integration
        env:
          RUN_SCHEDULED_DEPARTURE_INTEGRATION: "true"
        run: pnpm test:scheduled-departure:integration

      - name: ScheduledDeparture materializer PostgreSQL integration
        env:
          RUN_SCHEDULED_DEPARTURE_MATERIALIZER_INTEGRATION: "true"
          TZ: America/Guayaquil
        run: pnpm test:scheduled-departure-materializer:integration

      - name: Phase 6 operational PostgreSQL integration
        env:
          RUN_PHASE_6_OPERATIONAL_INTEGRATION: "true"
          TZ: America/Guayaquil
        run: pnpm test:phase6:operational-integration

      - name: Phase 6 API PostgreSQL integration
        env:
          RUN_PHASE_6_API_INTEGRATION: "true"
          TZ: America/Guayaquil
        run: pnpm test:phase6:api-integration

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm exec jest --runInBand

      - name: OpenAPI contract
        run: pnpm test:openapi

      - name: Verify generated mobile API contracts
        run: pnpm verify:mobile-contracts

  mobile:
    name: Mobile Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/mobile

    env:
      # Valor no secreto: permite compilar el cliente sin depender de .env local.
      EXPO_PUBLIC_API_URL: https://api.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Verify mobile quality
        run: npm run verify

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/ups-go-mobile-export
